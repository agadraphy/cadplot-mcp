[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadplot-mcp"
version = "0.1.0"
description = "A safety-first MCP server for inspecting AutoCAD drawings and planning repeatable plot jobs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Demir Eren" }]
dependencies = [
  "cryptography>=46,<51",
  "httpx>=0.28,<0.29",
  "keyring>=25.6,<26",
  "mcp[cli]>=1.29,<1.30",
  "pydantic>=2.11,<2.13",
  "pypdf>=6.16.1,<7.0",
  "pyyaml>=6.0,<7.0",
  "typing-extensions>=4.12,<5.0",
]

[project.optional-dependencies]
autocad = ["pywin32>=305; sys_platform == 'win32'"]
dev = ["pip-audit>=2.9,<3.0", "pytest>=9.0.3,<10.0", "ruff>=0.9,<1.0"]

[project.scripts]
cadplot = "cadplot_mcp.cli:main"
cadplot-mcp = "cadplot_mcp.server:main"
cadplot-mcp-http = "cadplot_mcp.http_server:main"
cadplot-doctor = "cadplot_mcp.doctor:main"
cadplot-collect-pilot = "cadplot_mcp.pilot_cli:collect_main"
cadplot-collect-recovery = "cadplot_mcp.pilot_cli:collect_recovery_main"
cadplot-assemble-pilot = "cadplot_mcp.pilot_cli:assemble_main"
cadplot-validate-pilot = "cadplot_mcp.pilot_cli:validate_main"
cadplot-acceptance = "cadplot_mcp.acceptance_cli:main"
cadplot-tunnel-preflight = "cadplot_mcp.tunnel_preflight:main"
cadplot-probe-client-config = "cadplot_mcp.client_config:main"
cadplot-chatgpt-eval = "cadplot_mcp.chatgpt_eval_cli:main"
cadplot-sbom = "cadplot_mcp.sbom_cli:main"
cadplot-worker = "cadplot_mcp.worker_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cadplot_mcp", "packages/protocol/src/cadplot_protocol"]

[tool.hatch.build.targets.sdist]
exclude = ["/.uv-cache", "/.venv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
