[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cadplot-gateway"
version = "0.1.0"
description = "OAuth-protected public MCP gateway for registered CadPlot workstations."
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Demir Eren" }]
dependencies = [
  "cadplot-protocol==0.1.0",
  "cryptography>=46,<51",
  "httpx>=0.28,<1.0",
  "mcp[cli]>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "psycopg-pool>=3.2,<4.0",
  "pydantic>=2.12,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[tool.uv.sources]
cadplot-protocol = { path = "../../packages/protocol", editable = true }

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10.0", "pytest-asyncio>=1.0,<2.0", "ruff>=0.12,<1.0"]

[project.scripts]
cadplot-gateway = "cadplot_gateway.app:main"
cadplot-gateway-migrate = "cadplot_gateway.migrate:main"

[tool.hatch.build.targets.wheel]
packages = ["cadplot_gateway"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "cadplot_gateway/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
