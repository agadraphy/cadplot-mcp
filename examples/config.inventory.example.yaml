version: 1

# Copy this file outside the repository, then place only an authorized DWG copy below this folder.
allowed_roots:
  - "pilot-input"

# Keep the job workspace separate even though publishing remains disabled during inventory.
workspace_root: "pilot-work"

drawing_unit_mm: 1
scale_denominators: [1, 2, 5, 10, 20, 25, 50, 100, 200, 500]
scale_tolerance_ratio: 0.02
require_page_setup_match: true
layout_prefix: "CADPLOT"
pdf_page_tolerance_mm: 2
minimum_frame_confidence: 0.85
frame_layers: []

# Deliberately cannot match a normal paper label. Replace it only after inspect_drawing reports
# the exact authorized office page setup, plotter, plot style, media, and optional template layout.
paper_profiles:
  - id: "inventory_only"
    labels: ["__INVENTORY_ONLY_DO_NOT_PUBLISH__"]
    page_setup: "__NOT_CONFIGURED__"
    plotter: "__NOT_CONFIGURED__.pc3"
    plot_style: "__NOT_CONFIGURED__.ctb"
    tolerance_mm: 0
