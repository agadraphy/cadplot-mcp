version: 1

# CadPlot MCP cannot inspect paths outside these roots.
allowed_roots:
  - "C:/Projects"

# Optional separate read-only roots for approved external DWG/DWT layout templates.
# template_roots:
#   - "C:/CompanyCAD/Templates"

# Staged DWG copies, job manifests, and PDFs are written only below this folder.
workspace_root: "C:/CadPlotWork"

# Millimetres represented by one model-space drawing unit. Common office default: 1 unit = 1 mm.
drawing_unit_mm: 1
scale_denominators: [1, 2, 5, 10, 20, 25, 50, 100, 200, 500]
scale_tolerance_ratio: 0.02
require_page_setup_match: true
layout_prefix: "CADPLOT"
pdf_page_tolerance_mm: 2
minimum_frame_confidence: 0.85
# Each read-only DWG inspection runs in a killable helper process with this timeout.
inspection_timeout_seconds: 120
# Optional office-standard allowlist. Empty means any layer may be inspected as a frame.
frame_layers: []

paper_profiles:
  - id: "sheet_70x100"
    labels: ["70x100", "100x70", "700x1000 mm", "1000x700 mm"]
    page_setup: "OFFICE_70x100"
    plotter: "DWG To PDF.pc3"
    plot_style: "monochrome.ctb"
    # Optional but recommended: exact case-sensitive value reported by AutoCAD.
    # canonical_media: "UserDefinedMetric (700.00 x 1000.00MM)"
    # Optional: clone this existing paper-space layout and reuse its single floating viewport.
    # template_layout: "TEMPLATE_70X100"
    # To use that layout from an external asset instead, also pin both fields below. The file is
    # inspected read-only and copied only into the isolated job; never commit the company asset.
    # template_drawing: "C:/CompanyCAD/Templates/office-70x100.dwt"
    # template_sha256: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    tolerance_mm: 3

  - id: "sheet_50x70"
    labels: ["50x70", "70x50", "500x700 mm", "700x500 mm"]
    page_setup: "OFFICE_50x70"
    plotter: "DWG To PDF.pc3"
    plot_style: "monochrome.ctb"
    # canonical_media: "UserDefinedMetric (500.00 x 700.00MM)"
    tolerance_mm: 3
