name: tests

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: uv sync --extra dev --extra autocad
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run python scripts/smoke-mcp-stdio.py
      - run: uv run python scripts/run-synthetic-demo.py
      - run: uv build
      - run: uv run python scripts/audit-release-artifacts.py dist
      - run: dotnet build src/dotnet/CadPlotMcp.sln --configuration Release
      - run: dotnet test src/dotnet/CadPlotMcp.Core.Tests/CadPlotMcp.Core.Tests.csproj --configuration Release --no-build
