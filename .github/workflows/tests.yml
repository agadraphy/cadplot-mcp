name: tests

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: uv sync --frozen --extra dev --extra autocad
      - name: Canonical local preflight (no AutoCAD launch)
        run: >-
          powershell.exe -NoProfile -ExecutionPolicy Bypass
          -File scripts/run-local-preflight.ps1 -SkipSync -AuditDependencies
